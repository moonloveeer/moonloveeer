name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake libssl-dev python3-dev libgmp-dev libboost-all-dev swig
      - run: python -m pip install build && cd vendor/qrllib && python -m build --wheel .
      - uses: actions/upload-artifact@v4
        with: { name: pyqrllib-wheel, path: vendor/qrllib/dist/pyqrllib-*.whl, retention-days: 1 }

  tests:
    needs: build-wheel
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get update && sudo apt-get install -y build-essential cmake libssl-dev python3-dev libgmp-dev libboost-all-dev swig
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest -e . --no-deps
      - uses: actions/download-artifact@v4
        with: { name: pyqrllib-wheel, path: vendor/qrllib/dist/ }
      - run: python -m pip install vendor/qrllib/dist/pyqrllib-*.whl
      - env: { PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/qrl }
        run: python -m pytest tests/test_wallet_send.py tests/test_api_endpoints.py
