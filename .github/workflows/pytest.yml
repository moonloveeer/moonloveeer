name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  tests:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install brew build toolchain
        run: |
          brew update
          brew install cmake openssl@3 gmp boost swig rust pkg-config
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(brew --prefix openssl@3)/lib/pkgconfig:$(brew --prefix gmp)/lib/pkgconfig" >> $GITHUB_ENV
          echo "CMAKE_OSX_ARCHITECTURES=arm64" >> $GITHUB_ENV

      - name: Set up Python (3.13)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          ls -lah wheels || true
          python -m pip install wheels/pyqrllib-1.2.4.post1-cp313-cp313-macosx_14_0_arm64.whl
          python -m pip install -r requirements.txt
          python -m pip install pytest
          python -m pip install -e . --no-deps

      - name: Run pytest suite
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/qrl
        run: |
          python -m pytest tests/test_wallet_send.py tests/test_api_endpoints.py
