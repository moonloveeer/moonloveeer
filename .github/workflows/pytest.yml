name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-wheel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev python3-dev libgmp-dev libboost-all-dev swig

      - name: Build pyqrllib wheel
        run: |
          cd vendor/qrllib
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --wheel .

      - name: Upload pyqrllib wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: pyqrllib-wheel
          path: vendor/qrllib/dist/pyqrllib-*.whl
          retention-days: 1

  tests:
    needs: build-wheel
    runs-on: ubuntu-latest
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev python3-dev libgmp-dev libboost-all-dev swig

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
          python -m pip install -e . --no-deps

      - name: Download pyqrllib wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: pyqrllib-wheel
          path: vendor/qrllib/dist/

      - name: Install pyqrllib wheel
        run: python -m pip install vendor/qrllib/dist/pyqrllib-*.whl

      - name: Run pytest suite
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/qrl
        run: |
          python -m pytest tests/test_wallet_send.py tests/test_api_endpoints.py
