name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-pyqrllib-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - name: Build pyqrllib wheel from PyPI (manylinux2014 cp310)
        run: |
          mkdir -p wheelhouse
          docker run --rm \
            -v "${{ github.workspace }}/wheelhouse:/wheelhouse" \
            quay.io/pypa/manylinux2014_x86_64 bash -lc '
              set -euo pipefail
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
              export PATH="$HOME/.cargo/bin:$PATH"
              /opt/python/cp310-cp310/bin/python -m pip install --upgrade pip wheel setuptools
              /opt/python/cp310-cp310/bin/python -m pip wheel -w /wheelhouse "pyqrllib==1.2.4"
            '
      - uses: actions/upload-artifact@v4
        with:
          name: pyqrllib-wheel
          path: wheelhouse/pyqrllib-*.whl
          retention-days: 3

  tests:
    needs: build-pyqrllib-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.10' }
      - name: Install runtime system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libgmp-dev
      - uses: actions/download-artifact@v4
        with:
          name: pyqrllib-wheel
          path: wheelhouse/
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install wheelhouse/pyqrllib-*.whl
          python -m pip install -r requirements.txt
          python -m pip install pytest
          python -m pip install -e . --no-deps
      - name: Run pytest suite
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/qrl
        run: |
          python -m pytest -vv -s tests/test_wallet_send.py tests/test_api_endpoints.py
