name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev python3-dev libgmp-dev libboost-all-dev swig

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v '^pyqrllib' requirements.txt > /tmp/ci-requirements.txt
          python -m pip install -r /tmp/ci-requirements.txt
          python -m pip install pytest
          python -m pip install -e . --no-deps

      - name: Run pytest suite
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/qrl
        run: |
          python -m pytest tests/test_wallet_send.py tests/test_api_endpoints.py
