name: CI

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pyqrllib-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake libssl-dev libgmp-dev libboost-all-dev swig rustc cargo pkg-config python3-dev
      - name: Cache pyqrllib wheel
        id: cache-wheel
        uses: actions/cache@v4
        with:
          path: wheelhouse/
          key: pyqrllib-wheel-${{ runner.os }}-py312-v1-1.2.4
      - name: Build pyqrllib wheel
        if: steps.cache-wheel.outputs.cache-hit != 'true'
        env:
          CMAKE_GENERATOR: Ninja
          CXXFLAGS: -include stdint.h
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel setuptools cmake ninja
          mkdir -p wheelhouse
          python -m pip wheel -w wheelhouse "pyqrllib==1.2.4" 2>&1 | tee wheelhouse/pyqrllib-build.log
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pyqrllib-build-logs
          path: wheelhouse/pyqrllib-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: pyqrllib-wheel
          path: wheelhouse/pyqrllib-*.whl
          retention-days: 14

  tests:
    needs: build-pyqrllib-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      - name: Install runtime system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev libgmp-dev
      - uses: actions/download-artifact@v4
        with:
          name: pyqrllib-wheel
          path: wheelhouse/
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install wheelhouse/pyqrllib-*.whl
          python -m pip install pip-tools cyclonedx-bom
          python -m pip install pytest pytest-cov
          pip-compile --generate-hashes -o requirements.lock requirements.txt
          python -m pip install --require-hashes -r requirements.lock
      - name: Run pytest suite
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/qrl
        run: |
          python -m pytest -vv -s --cov=qrl --cov-report=xml
      - name: Generate SBOM (CycloneDX)
        if: always()
        run: |
          cyclonedx-bom -o sbom.json -p pip -i requirements.lock
      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - name: Run pre-commit
        run: |
          python -m pip install --upgrade pip pre-commit
          pre-commit run --all-files --show-diff-on-failure
