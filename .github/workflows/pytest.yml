name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build-pyqrllib-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - name: Set up Python
        uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev libgmp-dev libboost-all-dev swig rustc cargo pkg-config python3-dev
      - name: Build pyqrllib wheel (Ubuntu host cp310, verbose)
        env:
          CMAKE_GENERATOR: Ninja
          CMAKE_ARGS: -DCMAKE_VERBOSE_MAKEFILE=ON -DBUILD_PYTHON=ON -DBUILD_TESTS=OFF
          VERBOSE: "1"
          CXXFLAGS: -include stdint.h
          Python_EXECUTABLE: ${{ env.pythonLocation }}/bin/python
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip wheel setuptools cmake ninja
          mkdir -p wheelhouse
          python -m pip wheel -v -w wheelhouse "pyqrllib==1.2.4" 2>&1 | tee wheelhouse/pyqrllib-build.log
      - name: Upload build logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyqrllib-build-logs
          path: wheelhouse/pyqrllib-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: pyqrllib-wheel
          path: wheelhouse/pyqrllib-*.whl
          retention-days: 3

  tests:
    needs: build-pyqrllib-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: false }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install runtime system libs
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev libgmp-dev
      - uses: actions/download-artifact@v4
        with:
          name: pyqrllib-wheel
          path: wheelhouse/
      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install wheelhouse/pyqrllib-*.whl
          python -m pip install -r requirements.txt
          python -m pip install pytest
          python -m pip install -e . --no-deps
      - name: Run pytest suite
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/qrl
        run: |
          python -m pytest -vv -s tests/test_wallet_send.py tests/test_api_endpoints.py
