name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  tests:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python (3.13)
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyqrllib==1.2.4
          python -m pip install pyqrandomx>=0.2.0 pyqryptonight>=0.10.26 tx>=18.7.0
          python -m pip install -r requirements.txt
          python -m pip install pytest
          python -m pip install -e . --no-deps

      - name: Run pytest suite
        env:
          PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/qrl
        run: |
          python -m pytest tests/test_wallet_send.py tests/test_api_endpoints.py
