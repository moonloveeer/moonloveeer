name: Kubernetes Manifests Lint

on:
  push:
    branches: [ main, master ]
    paths:
      - 'k8s/**/*.yaml'
      - '.github/workflows/k8s-lint.yml'
  pull_request:
    paths:
      - 'k8s/**/*.yaml'
      - '.github/workflows/k8s-lint.yml'

permissions:
  contents: read

concurrency:
  group: k8s-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kubeconform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with: { submodules: false }

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar -xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate manifests
        working-directory: k8s
        run: |
          kubeconform -summary -strict -ignore-missing-schemas -schema-location default -schema-location https://raw.githubusercontent.com/yannh/kubernetes-json-schema/master $(find . -name '*.yaml' -print)
