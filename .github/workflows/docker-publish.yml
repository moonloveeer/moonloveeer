name: Docker Publish

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
    paths-ignore:
      - 'docs/**'

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with: { submodules: false }

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image (load for smoke test)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: wallet-ci:${{ github.sha }}

      - name: Smoke test /healthz
        run: |
          set -euo pipefail
          docker run -d --name qrl-wallet-test -p 5001:5001 -e PORT=5001 wallet-ci:${GITHUB_SHA}
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5001/healthz >/dev/null; then
              ok=1; break; fi
            sleep 2
          done
          docker logs qrl-wallet-test || true
          docker rm -f qrl-wallet-test
          if [ "${ok:-0}" != "1" ]; then echo "Smoke test failed"; exit 1; fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
