<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>QRL Wallet Whitepaper</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" />
    <style>
      body { max-width: 900px; margin: 2rem auto; padding: 0 1rem; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Helvetica Neue', 'Fira Sans', 'Droid Sans', Arial, sans-serif; }
      pre code { display: block; overflow-x: auto; padding: 1rem; background: #0f172a; color: #e5e7eb; border-radius: 8px; }
      code { background: #f5f5f5; padding: 0.2rem 0.4rem; border-radius: 4px; }
      h1, h2, h3 { margin-top: 2rem; }
      .container { margin-bottom: 4rem; }
    </style>
    <script nonce="{{ csp_nonce }}" src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <script nonce="{{ csp_nonce }}">mermaid.initialize({ startOnLoad: true, theme: 'default' });</script>
  </head>
  <body>
    <div class="container">
      {{ content|safe }}
    </div>
  </body>
</html>
